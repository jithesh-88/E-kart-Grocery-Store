<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Emart Inventory Management</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1{
            color: #333;
        }

        .section{
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 5px rgba(0,0,0,0.2);
        }

        input{
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button{
            padding: 10px 20px;
            border: none;
            background: rgb(61, 158, 199);
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: darkblue;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td{
            border: 1px solid black;
        }

        th, td{
            padding: 10px;
            text-align: center;
        }

    </style>

</head>

<body>

    <h1>Emart Inventory Management</h1>

    <!-- ADD PRODUCT -->

    <div class="section">

        <h2>Add Product</h2>

        <input type="text"
               id="productName"
               placeholder="Product Name">

        <input type="text"
               id="productCategory"
               placeholder="Category">

        <input type="number"
               id="productPrice"
               placeholder="Price">

        <input type="number"
               id="productStock"
               placeholder="Stock Quantity">

        <button onclick="addProduct()">
            Add Product
        </button>

    </div>


    <!-- ADD CUSTOMER -->

    <div class="section">

        <h2>Add Customer</h2>

        <input type="text"
               id="customerName"
               placeholder="Customer Name">

        <input type="text"
               id="customerPhone"
               placeholder="Phone">

        <button onclick="addCustomer()">
            Add Customer
        </button>

    </div>


    <!-- ADD SUPPLIER -->

    <div class="section">

        <h2>Add Supplier</h2>

        <input type="text"
               id="supplierName"
               placeholder="Supplier Name">

        <input type="text"
               id="supplierContact"
               placeholder="Contact">

        <button onclick="addSupplier()">
            Add Supplier
        </button>

    </div>


    <!-- SUPPLIER ADDS STOCK -->

    <div class="section">

        <h2>Supplier Adds Stock</h2>

        <input type="number"
               id="stockProductId"
               placeholder="Product ID">

        <input type="number"
               id="stockSupplierId"
               placeholder="Supplier ID">

        <input type="number"
               id="stockQuantity"
               placeholder="Quantity Added">

        <button onclick="addStock()">
            Add Stock
        </button>

    </div>


    <!-- PLACE ORDER -->

    <div class="section">

        <h2>Place Order</h2>

        <input type="number"
               id="customerId"
               placeholder="Customer ID">

        <input type="number"
               id="productId"
               placeholder="Product ID">

        <input type="number"
               id="quantity"
               placeholder="Quantity">

        <button onclick="placeOrder()">
            Place Order
        </button>

    </div>


    <!-- PRODUCTS TABLE -->

    <div class="section">

        <h2>Products</h2>

        <table>

            <thead>

                <tr>

                    <th>Product ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>

                </tr>

            </thead>

            <tbody id="productTableBody">

            </tbody>

        </table>

    </div>


    <!-- CUSTOMERS TABLE -->

    <div class="section">

        <h2>Customers</h2>

        <table>

            <thead>

                <tr>

                    <th>Customer ID</th>
                    <th>Name</th>
                    <th>Phone</th>

                </tr>

            </thead>

            <tbody id="customerTableBody">

            </tbody>

        </table>

    </div>


    <!-- SUPPLIERS TABLE -->

    <div class="section">

        <h2>Suppliers</h2>

        <table>

            <thead>

                <tr>

                    <th>Supplier ID</th>
                    <th>Name</th>
                    <th>Contact</th>

                </tr>

            </thead>

            <tbody id="supplierTableBody">

            </tbody>

        </table>

    </div>


    <script src="script.js"></script>

</body>
</html>
